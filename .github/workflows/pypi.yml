name: pypi
on:
  release:
    types:
      - created
jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing: no API token. Register this repository, this workflow
    # file and the "pypi" environment as a trusted publisher on pypi.org first.
    environment:
      name: pypi
      url: https://pypi.org/project/django-copyist/
    permissions:
      id-token: write
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Build dists
        run: make build
      - name: Pypi Publish
        uses: pypa/gh-action-pypi-publish@release/v1
