name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        django-version: ["5.2.*", "6.0.*", "6.1.*"]
        exclude:
          # Django 5.2 supports Python 3.10-3.14
          - python-version: "3.15"
            django-version: "5.2.*"
          # Django 6.0 supports Python 3.12-3.14
          - python-version: "3.11"
            django-version: "6.0.*"
          - python-version: "3.15"
            django-version: "6.0.*"
          # Django 6.1 supports Python 3.12-3.15
          - python-version: "3.11"
            django-version: "6.1.*"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Run ci
        run: uv run --extra dev --with "Django==${{ matrix.django-version }}" pytest example/demo/tests example/transport_network/tests
