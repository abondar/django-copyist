name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["4.2.*", "5.2.*"]
        exclude:
          - python-version: "3.13"
            django-version: "4.2.*"
          - python-version: "3.14"
            django-version: "4.2.*"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prerelease: true
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Run ci
        run: uv run --with "Django==${{ matrix.django-version }}" pytest example/demo/tests example/transport_network/tests
