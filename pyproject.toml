[project]
name = "django-copyist"
version = "0.2.0"
description = "Deep-copy Django model instances with their related objects, declaratively and with bulk_create"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "abondar" }]
requires-python = ">=3.11,<4.0"
keywords = [
    "django",
    "copy",
    "clone",
    "duplicate",
    "deep-copy",
    "deepcopy",
    "model",
    "orm",
    "related-objects",
    "bulk-create",
    "tree",
    "template",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2,<6.2",
]

[project.urls]
Homepage = "https://github.com/abondar/django-copyist"
Documentation = "https://abondar.github.io/django-copyist/"
Repository = "https://github.com/abondar/django-copyist.git"
Changelog = "https://github.com/abondar/django-copyist/blob/main/CHANGELOG.rst"
Issues = "https://github.com/abondar/django-copyist/issues"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0,<4.0",
    "pytest>=8.1.1,<9.0",
    "factory-boy>=3.3.0,<4.0",
    "pytest-django>=4.8.0,<5.0",
    "ruff>=0.9.9,<0.10",
    "sphinx>=7.3.7,<8.0",
    "sphinx-book-theme>=1.1.2,<2.0",
    "enum-tools[sphinx]>=0.12.0,<0.13.0",
    "sphinx-llms-txt>=0.7,<0.8",
    "psycopg[binary]>=3.2,<4.0",
    "pytest-cov>=6.0,<8.0",
]
bench = [
    "django-clone>=5.5,<6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".meta",
    ".tox",
    "*/tests/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.sdist]
include = ["django_copyist", "CHANGELOG.rst", "LICENSE.txt", "README.rst"]

[tool.hatch.build.targets.wheel]
packages = ["django_copyist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
