[project]
name = "django-copyist"
version = "0.1.3"
description = "Tool for precise and efficient django model copying"
readme = "README.rst"
license = { file = "LICENSE.txt" }
authors = [{ name = "abondar" }]
requires-python = ">=3.11,<4.0"
keywords = ["django", "copy", "clone", "model"]
dependencies = [
    "Django>=4.2,<6.0",
]

[project.urls]
Homepage = "https://github.com/abondar/django-copyist"
Repository = "https://github.com/abondar/django-copyist.git"
Documentation = "https://abondar.github.io/django-copyist/"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0,<4.0",
    "pytest>=8.1.1,<9.0",
    "factory-boy>=3.3.0,<4.0",
    "pytest-django>=4.8.0,<5.0",
    "ruff>=0.9.9,<0.10",
    "sphinx>=7.3.7,<8.0",
    "sphinx-book-theme>=1.1.2,<2.0",
    "enum-tools[sphinx]>=0.12.0,<0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".meta",
    ".tox",
    "*/tests/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build]
include = ["CHANGELOG.rst", "LICENSE.txt", "README.rst"]

[tool.hatch.build.targets.wheel]
packages = ["django_copyist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
